name: Website checks
on:
  push:
    branches: [main, codex/gloam-website, codex/web-workspace]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    # Match the pinned Playwright browser's supported Linux dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/app/workspace.js
          node --check dist/app/mascot.js
      - name: Install browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check responsive layout, simulation and controls
        run: node scripts/verify-browser.cjs
      - name: Check web workspace layout and signed-out controls
        run: node scripts/verify-workspace-static.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-screenshots
          path: artifacts/
          retention-days: 7
      - name: Verify the production deployment
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify-deployment.cjs
