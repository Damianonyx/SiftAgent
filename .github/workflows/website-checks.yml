name: Website checks
on:
  push:
    branches: [main, codex/gloam-website]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check dist/app.js
      - name: Install browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check responsive layout, simulation and controls
        run: node scripts/verify-browser.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-screenshots
          path: artifacts/browser/
          retention-days: 7
